<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视觉验证画廊</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #08090d; }
      .gal-root { position: fixed; inset: 0; display: flex; flex-direction: column; color: #f5f7fa; font-family: system-ui, sans-serif; }
      .gal-bar { position: relative; z-index: 200; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        padding: 8px 12px; background: rgba(12,14,20,0.92); border-bottom: 2px solid #000; }
      .gal-bar b { margin-right: 8px; color: #d8b86a; }
      .gal-note { color: #9aa3b2; font-size: 12px; margin-left: 8px; }
      .gal-stage { position: relative; flex: 1; overflow: auto; }
      .gal-grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 20px; align-content: flex-start; }
      .gal-card { background: #0e1118; border: 2px solid #1d2330; padding: 10px; min-width: 220px; }
      .gal-notes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; min-height: 120px; }
      .gal-label { margin-top: 8px; text-align: center; color: #9aa3b2; font-size: 13px; }
      .gal-controls { position: fixed; left: 14px; bottom: 14px; z-index: 200; display: flex; gap: 8px; align-items: center;
        padding: 8px 10px; background: rgba(12,14,20,0.92); border: 2px solid #000; color: #f5f7fa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/preview/gallery.jsx"></script>
  </body>
</html>
